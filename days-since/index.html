<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Days since {what} {when}</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Count the days since an important date.">
    <link rel="shortcut icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='23' rx='4' fill='%231d6fa8'/%3E%3Cpath d='M3 12h26M9 3v6m14-6v6' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="script.js?v=3" defer></script>
  </head>
  <body>
    <div class="countdown-gear">
      <button
        class="config-toggle"
        title="Show options"
        aria-label="Show options"
        aria-controls="config-panel"
        aria-expanded="false"
        type="button">
        <i class="fa-solid fa-gear" aria-hidden="true"></i>
      </button>
    </div>

    <main class="countdown-main">
      <div class="countdown-content" aria-live="polite">
        <div class="days"></div>
        <div class="countdown-what"></div>
        <div class="countdown-when"></div>
        <div class="extra"></div>
      </div>

      <form id="config-panel" class="countdown-form config-panel" action="" method="get">
        <h3><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> Options</h3>
        <div class="options-row">
          <label for="name">
            <i class="fa-solid fa-tag" aria-hidden="true"></i>
            <span class="sr-only">Name</span>
          </label>
          <input required type="text" id="name" name="name" placeholder="Name">
        </div>
        <div class="options-row">
          <label for="date">
            <i class="fa-solid fa-calendar" aria-hidden="true"></i>
            <span class="sr-only">Date</span>
          </label>
          <input required type="date" id="date" name="date" placeholder="YYYY-MM-DD" pattern="\d{4}-\d{2}-\d{2}">
        </div>
        <div class="options-row">
          <label for="themeHue">
            <i class="fa-solid fa-palette" aria-hidden="true"></i>
            <span class="sr-only">Theme hue</span>
          </label>
          <input required type="range" id="themeHue" name="themeHue" min="0" max="360" step="1">
        </div>
        <div class="form-actions">
          <button type="submit"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Save</button>
          <button type="button" id="reset-options"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Reset</button>
        </div>
      </form>
    </main>
  </body>
</html>
